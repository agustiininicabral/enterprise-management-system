name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/EnterpriseManagement.Tests/EnterpriseManagement.Tests.csproj
      - name: Test
        run: dotnet test src/EnterpriseManagement.Tests/EnterpriseManagement.Tests.csproj --configuration Release --logger "trx;LogFileName=backend-tests.trx"
      - name: Build API
        run: dotnet build src/EnterpriseManagement.Api/EnterpriseManagement.Api.csproj --configuration Release --no-restore
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  sqlserver-e2e:
    name: SQL Server migration and browser E2E
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQLSERVER_PASSWORD || 'Ci-Only_Strong-Passw0rd!' }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for SQL Server
        run: |
          for attempt in {1..60}; do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become available" >&2
          exit 1
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.33
      - name: Apply migrations to SQL Server
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=EnterpriseManagementDb;User Id=sa;Password=Ci-Only_Strong-Passw0rd!;Encrypt=False;TrustServerCertificate=True"
        run: dotnet ef database update --project src/EnterpriseManagement.Api --startup-project src/EnterpriseManagement.Api
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=EnterpriseManagementDb;User Id=sa;Password=Ci-Only_Strong-Passw0rd!;Encrypt=False;TrustServerCertificate=True"
          Jwt__Issuer: EnterpriseManagement.Api.CI
          Jwt__Audience: EnterpriseManagement.Client.CI
          Jwt__Key: "ci-only-signing-key-must-be-at-least-32-bytes-long"
          Cors__Origins__0: http://127.0.0.1:5173
        run: |
          dotnet run --project src/EnterpriseManagement.Api --configuration Release --no-build > /tmp/enterprise-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:5080/health/ready; then exit 0; fi
            sleep 2
          done
          cat /tmp/enterprise-api.log
          exit 1
      - name: Install frontend dependencies and browsers
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/enterprise-frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:5173; then exit 0; fi
            sleep 2
          done
          cat /tmp/enterprise-frontend.log
          exit 1
      - name: Run browser E2E against SQL Server
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-e2e-diagnostics
          path: |
            /tmp/enterprise-api.log
            /tmp/enterprise-frontend.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
