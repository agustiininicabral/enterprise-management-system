name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/EnterpriseManagement.Tests/EnterpriseManagement.Tests.csproj
      - name: Test
        run: dotnet test src/EnterpriseManagement.Tests/EnterpriseManagement.Tests.csproj --configuration Release --logger "trx;LogFileName=backend-tests.trx"
      - name: Build API
        run: dotnet build src/EnterpriseManagement.Api/EnterpriseManagement.Api.csproj --configuration Release --no-restore
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
